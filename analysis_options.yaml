# vBank rewrite: strict lints. Zero analyzer issues is a merge gate —
# `flutter analyze` must report "No issues found" on every change.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Rewrite in progress: only rewritten code is gated. Legacy paths are
  # excluded until their module is ported into lib/src, then un-excluded.
  exclude:
    - lib/core/**
    - lib/desktop/**
    - lib/models/**
    - lib/providers/**
    - lib/screens/**
    - lib/services/**
    - lib/ui/**
    - lib/widgets/**
    - lib/main.dart
    - test/*.dart
    - test/helpers/**
  errors:
    # Treat these as build-breaking.
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: error
    dead_code: error
    unused_element: error
    unused_import: error
    unused_local_variable: error
    cancel_subscriptions: error
    close_sinks: error
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    # Readability: code says what it means, no cleverness.
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    require_trailing_commas: true
    lines_longer_than_80_chars: true
    prefer_constructors_over_static_methods: true
    # Testability: explicit types on every public API, no dynamic leaks.
    always_declare_return_types: true
    type_annotate_public_apis: true
    avoid_dynamic_calls: true
    avoid_annotating_with_dynamic: true
    # Hygiene.
    avoid_print: true
    prefer_relative_imports: true
    use_string_buffers: true
    cascade_invocations: true
    depend_on_referenced_packages: true
    no_leading_underscores_for_library_prefixes: true
    public_member_api_docs: true
