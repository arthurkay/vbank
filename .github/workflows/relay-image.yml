name: Relay image

# Builds the relay container and pushes it to GitHub Container Registry as
# ghcr.io/<owner>/vbank-relay. Runs on changes to the relay's inputs, on v*
# tags (also tagged with the version) and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'lib/core/relay/**'
      - 'lib/core/ipfs/**'
      - 'bin/vbank_relay.dart'
      - 'deploy/relay/Dockerfile'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'third_party/**'
      - '.github/workflows/relay-image.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vbank-relay

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=vBank relay
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
