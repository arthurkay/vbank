name: Release desktop builds

# Tag a commit `vX.Y.Z` and push the tag: this builds the Linux (tar.gz),
# Windows (zip + Inno Setup installer) and macOS (dmg) apps — plus a signed
# Android APK when the keystore secrets are configured — and attaches them to a
# GitHub release of the same name. Store publishing (Play / TestFlight) runs on
# Codemagic from the same tag (codemagic.yaml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install GTK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          STAGE=vbank-$VERSION-linux-x64
          mkdir -p "$STAGE"
          cp -r build/linux/x64/release/bundle/. "$STAGE/"
          cp linux/vbank.desktop tool/brand/install-linux.sh "$STAGE/"
          cp assets/brand/icon_1024.png "$STAGE/vbank.png"
          tar -czf "$STAGE.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vbank-*-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $stage = "vbank-$version-windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          # Inno Setup 6 ships on the windows-latest runner image.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVBankVersion=$version" windows\installer\vbank.iss
          # Flatten: upload-artifact keeps the dist\ prefix, which the release glob would miss.
          Move-Item dist\vbank-*-windows-x64-setup.exe .
          Get-ChildItem vbank-*
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            vbank-*-windows-x64.zip
            vbank-*-windows-x64-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          STAGE=vbank-$VERSION-macos
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          hdiutil create -volname "vBank" -srcfolder "$STAGE" -ov -format UDZO "$STAGE.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: vbank-*-macos.dmg

  # Signed Android APK, attached to the GitHub release when the keystore
  # secrets exist (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD —
  # see DEPLOYMENT.md). Play Store publishing is Codemagic's job (codemagic.yaml);
  # this is the same keystore, the same CM_KEYSTORE_* contract the Gradle file
  # reads, so the two pipelines produce identically signed builds.
  android:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Decode the release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vbank-release.jks"
          echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/vbank-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # GOOGLE_SERVER_CLIENT_ID is a repository *variable* (not secret): the Web OAuth client id
          # that enables Google Drive backup. Empty → the feature reports itself as not configured.
          flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="${{ vars.GOOGLE_SERVER_CLIENT_ID }}"
          VERSION=${GITHUB_REF_NAME#v}
          mv build/app/outputs/flutter-apk/app-release.apk "vbank-$VERSION-android.apk"
      - name: Skipped (no keystore secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: echo "KEYSTORE_BASE64 not set — no Android build attached to this release."
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android
          path: vbank-*-android.apk

  release:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: vBank ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.apk
