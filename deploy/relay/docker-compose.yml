services:
  relay:
    image: ghcr.io/arthurkay/vbank-relay:latest
    container_name: vbank-relay
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      # The address members will dial: your VPS's public IPv4.
      VBANK_RELAY_PUBLIC_IP: "${VBANK_RELAY_PUBLIC_IP:?set VBANK_RELAY_PUBLIC_IP in .env}"
      VBANK_RELAY_PORT: "4001"
    volumes:
      - relay-data:/data
volumes:
  relay-data:
