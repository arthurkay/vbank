services:
  relay:
    image: ghcr.io/arthurkay/vbank-relay:latest
    container_name: vbank-relay
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      # How members reach this relay. Preferred: a hostname (A/CNAME record
      # pointing at the VPS) → members get a /dns4/ address that survives an IP
      # change. Fall back to VBANK_RELAY_PUBLIC_IP for a bare /ip4/ address.
      VBANK_RELAY_PUBLIC_HOST: "${VBANK_RELAY_PUBLIC_HOST:-}"
      VBANK_RELAY_PUBLIC_IP: "${VBANK_RELAY_PUBLIC_IP:-}"
      VBANK_RELAY_PORT: "4001"
      # Optional: pin the peer id without relying on the volume
      # (openssl rand -base64 32). Keep it secret.
      VBANK_RELAY_IDENTITY_SEED: "${VBANK_RELAY_IDENTITY_SEED:-}"
    volumes:
      - relay-data:/data
volumes:
  relay-data:
