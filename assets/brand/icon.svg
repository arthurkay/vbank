    <rect x="532" y="672" width="22" height="96"/><rect x="566" y="672" width="14" height="96"/><rect x="592" y="672" width="8" height="96"/>
    <rect x="612" y="672" width="28" height="96"/><rect x="652" y="672" width="8" height="96"/><rect x="672" y="672" width="14" height="96"/>
    <rect x="698" y="672" width="26" height="96"/>
