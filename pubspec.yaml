name: vbank
description: "vBank — Distributed village banking via IPFS"
publish_to: 'none'
version: 1.7.0+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI

  # IPFS / P2P
  dart_ipfs: ^1.11.7

  # Local storage (encrypted)

  # State management
  flutter_riverpod: ^2.5.0

  # Crypto
  cryptography: ^2.7.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # QR & Sharing
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0

  # Deep linking

  # Encoding

  # Utils
  uuid: ^4.0.0
  intl: ^0.20.2
  path_provider: ^2.1.0
  path: ^1.9.0
  crypto: ^3.0.3
  app_links: ^7.0.0
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^10.3.1
  file_picker: ^11.0.3
  shadcn_flutter: ^0.0.51
  cbor: ^6.3.7
  yaru: ^10.2.0
  macos_ui: ^2.2.2
  fluent_ui: 4.15.1
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqflite_common_ffi: ^2.4.0+3
  system_theme: 3.2.0
  pdf: ^3.12.0
  archive: ^4.0.9
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  icloud_storage: ^2.2.0
  connectivity_plus: ^7.3.1

# package:sqlite3 (used by sqflite_common_ffi on desktop) bundles a SQLCipher
# build, so Linux and Windows get the same encrypted database as the mobile
# builds get through sqflite_sqlcipher.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon_1024.png

# dart_ipfs 1.11.7 with one patch: NetworkHandler passes
# IPFSConfig.libp2pIdentitySeed to the router, so a node keeps its peer id
# across restarts (upstream declares the field but never reads it). See
# third_party/dart_ipfs/VBANK_PATCHES.md.
dependency_overrides:
  dart_ipfs:
    path: third_party/dart_ipfs

# App icon — generated from assets/brand/icon.svg (see tool/brand/README.md):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon_1024.png
  android: true
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: assets/brand/icon_foreground_1024.png
  adaptive_icon_monochrome: assets/brand/icon_foreground_1024.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/icon_1024.png
    background_color: "#0B0B0C"
    theme_color: "#0B0B0C"
  macos:
    generate: true
    image_path: assets/brand/icon_1024.png
  windows:
    generate: true
    image_path: assets/brand/icon_1024.png
    icon_size: 256
